name: 'my_mrr_pipeline'
version: '1.0.0'
config-version: 2 

profile: 'my_mrr_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"] 

clean-targets: 
  - "target"
  - "dbt_packages"

seeds:
  my_mrr_pipeline:
    +schema: raw

models:
  my_mrr_pipeline:
  staging:
    +materialized: view
    +schema: staging
  intermediate:
    +materialized: view
    +schema: intermediate
  marts: 
    +materialized: table 
    +schema: marts