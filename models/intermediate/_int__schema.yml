version: 2
models: 
  - name: int_subscription_mrr_movements
    description: "Intermediate subscription MRR waterfall movements classifying new, expansion, contraction, churn and reactivation events"
    columns: 
      - name: subscription_id
        description: "Primary keys of the subscriptions"
        tests: 
          - not_null
          - relationships: 
              to: ref('stg_stripe__subscriptions')
              field: subscription_id
      - name: customer_id
        description: "Foreign key linking to customer records"
        tests: 
          - not_null
          - relationships: 
              to: ref('stg_stripe__customers')
              field: customer_id
      - name: mrr_movement_type
        description: "Classified MRR waterfall category"
        tests: 
          - not_null
          - accepted_values:
              values: ['new','expansion','contraction','churn','reactivation','no_change']
  - name: int_subscription_periods
    description: "Contigous subscription activty periods with valid_from to valid_to timestamp windows."
    columns: 
      - name: subscription_id
        tests: 
          - not_null
          - relationships:
              to: ref('stg_stripe__subscriptions')
              field: subscription_id
      - name: customer_id
        tests: 
          - not_null
          - relationships: 
              to: ref('stg_stripe__customers')
              field: customer_id
      - name: valid_from 
        tests:
          - not_null
  - name: int_subscription_months
    description: "Monthly spined grid tracking active customer MRR per calendar month."
    columns:
      - name: subscription_month_id
        tests:
          - unique
          - not_null
      - name: date_month
        tests:
          - not_null

  - name: int_cohort_retention
    description: "Cohort retention analysis measuring active customer counts and MRR over month offsets."
    columns:
      - name: cohort_month
        tests:
          - not_null
      - name: month_number
        tests:
          - not_null