version: 2

models:
  - name: metricflow_time_spine
    description: "Daily time spine table required by MetricFlow."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day

  - name: fct_mrr_movements
    description: "Event-level fact table recording all subscription MRR state changes."
    columns:
      - name: mrr_movement_id
        tests:
          - unique
          - not_null

  - name: fct_mrr_months
    description: "Active month-end MRR snapshot fact table."
    columns:
      - name: subscription_month_id
        tests:
          - unique
          - not_null
      - name: date_month
        description: "First day of the subscription month"
        meta:
          dimension:
            type: date
      - name: subscription_id
        description: "Foreign key to subscription"

  - name: dim_customers
    description: "Customer dimension table."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null