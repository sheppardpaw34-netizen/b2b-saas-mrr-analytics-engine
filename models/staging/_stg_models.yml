version: 2 
models: 
  - name: stg_stripe_customers
    columns: 
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: created_at
        tests:
          - not_null
  - name: stg_stripe_subscriptions
    columns:
      - name: subscription_id
        tests: 
          - not_null
          - unique
      - name: customer_id
        tests: 
          - not_null
          - relationships:
              to: ref('stg_stripe_customers')
              field: customer_id
      - name: subscription_status
        tests:
          - not_null
          - accepted_values:
              values: ['active','canceled','incomplete','incompleted_expired','past_due','trailing','unpaid','paused']
      - name: created_at
        tests: 
          - not_null
  - name: stg_stripe_invoices
    columns: 
      - name: invoice_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests: 
          - not_null
          - relationships:
              to: ref('stg_stripe_customers')
              field: customer_id
      - name: invoice_status
        tests: 
          - not_null
          - accepted_values: 
              values: ['draft','open','paid','uncollectible','void']
      - name: amount_due_usd
        tests: 
          - not_null
      - name: created_at
        tests: 
          - not_null

          