version 2: 
models: 
  - name: stg_stripe__subscriptions
    description: "Staged Stripe subscriptions with normalized plan prices, status, and interval details."
    columns: 
      - name: subscription_id
        description: "primary key"
        tests: 
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key"
        tests: 
          - not_null
      - name: customer_status
        description: "Current Customer Status"
        tests: 
          - not_null
      - name: plan_price_id
        description: "Plan wise Money"
        tests: 
          - not_null
      - name: plan_unit_amount
        description: "Unit Per customer"
        tests: 
          - not_null
  - name: stg_stripe__customers
    description: "Staged Stripe customer records."
    columns:
      - name: customer_id
        description: "Primary  key"
        tests: 
          - unique
          - not_null
      - name: customer_email
        description: "Validation of customer Credential"
        tests: 
          - not_null
  - name: stg_stripe__invoices
    description: "Staged Stripe invoice transactions and payment statuses."
    columns: 
      - name: invoice_id
        description: "Primary Key"
        tests: 
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key"
        tests: 
          - not_null
      - name: subscription_id 
        description: "Foreign key"
        tests: 
          - not_null
      - name: invoice_status
        description: "Status"
        tests: 
          - not_null
      - name: amount_paid
        description: "Money"
        tests: 
          - not_null

      
